<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タスク分解</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="タスク分解">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#EDF0F3; --card:#FFFFFF; --ink:#1D2B3A; --sub:#5F6B7A; --faint:#98A2AE; --line:#DCE1E7; --soft:#F4F6F8;
    --blue:#155E75; --blue-soft:#E1EEF2; --red:#B91C1C; --red-soft:#FBE7E7; --orange:#B45309; --orange-soft:#FCEFD9;
    --green:#15803D; --green-soft:#E3F3E8;
    --p5:#B91C1C; --p4:#D97706; --p3:#155E75; --p2:#7C8796; --p1:#C9D0D8;
    --nav-h:64px;
    --c-work:#155E75; --c-meet:#6D28D9; --c-move:#64748B; --c-break:#15803D; --c-learn:#B45309; --c-other:#9AA5B1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#121A23; --card:#1A2430; --ink:#E6EBF0; --sub:#A3AEBB; --faint:#6F7B88; --line:#2C3846; --soft:#212D3A;
      --blue:#5EB8CF; --blue-soft:#1C3440; --red:#F07171; --red-soft:#3A2224; --orange:#F0A95A; --orange-soft:#3A2D1C;
      --green:#6CCB8D; --green-soft:#1D3527; --p3:#5EB8CF; --p1:#3E4A57;
      --c-work:#5EB8CF; --c-meet:#B794F6; --c-move:#94A3B8; --c-break:#6CCB8D; --c-learn:#F0A95A; --c-other:#6F7B88;
    }
  }
  :root[data-theme="dark"] {
      --bg:#121A23; --card:#1A2430; --ink:#E6EBF0; --sub:#A3AEBB; --faint:#6F7B88; --line:#2C3846; --soft:#212D3A;
      --blue:#5EB8CF; --blue-soft:#1C3440; --red:#F07171; --red-soft:#3A2224; --orange:#F0A95A; --orange-soft:#3A2D1C;
      --green:#6CCB8D; --green-soft:#1D3527; --p3:#5EB8CF; --p1:#3E4A57;
      --c-work:#5EB8CF; --c-meet:#B794F6; --c-move:#94A3B8; --c-break:#6CCB8D; --c-learn:#F0A95A; --c-other:#6F7B88;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:"BIZ UDPGothic","Hiragino Sans","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink);
         font-size:15px; line-height:1.5; font-variant-numeric:tabular-nums; }
  button { font-family:inherit; cursor:pointer; }
  :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }

  /* ---- 上：今日の時間メーター ---- */
  header { position:sticky; top:0; z-index:5; background:var(--card); border-bottom:1px solid var(--line); padding:10px 14px 12px; }
  .top { display:flex; align-items:center; justify-content:space-between; }
  .today { font-size:13px; color:var(--sub); }
  .today b { color:var(--ink); font-size:17px; margin-right:6px; }
  .icon { background:none; border:none; font-size:20px; padding:4px 6px; color:var(--sub); }
  .meter { margin-top:8px; }
  .top { gap:8px; }
  .qswitch { display:flex; margin-left:auto; background:var(--soft); border:1px solid var(--line); border-radius:999px; padding:2px; }
  .qs { border:none; background:transparent; color:var(--sub); font-size:13px; font-weight:700; padding:7px 13px; border-radius:999px; touch-action:manipulation; }
  .qs.on { background:var(--blue); color:#fff; }
  .tab { touch-action:manipulation; }
  .meter-line { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; color:var(--sub); }
  .meter-line .big { font-size:22px; font-weight:700; color:var(--ink); }
  .meter-line .big small { font-size:13px; font-weight:400; color:var(--sub); margin-left:2px; }
  .alert { border:none; background:var(--red-soft); color:var(--red); font-weight:700; font-size:12px; padding:4px 9px; border-radius:999px; }
  .blocks { display:flex; gap:3px; margin-top:6px; }
  .blocks i { flex:1; height:12px; border-radius:3px; background:var(--soft); border:1px solid var(--line); }
  .blocks i.on { background:var(--blue); border-color:var(--blue); }
  .blocks i.full { background:var(--orange); border-color:var(--orange); }
  .blocks.rest { font-size:12px; color:var(--faint); }

  /* ---- 下：タブ ---- */
  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:6; height:var(--nav-h); display:flex; background:var(--card);
          border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
  .tab { flex:1; min-width:0; background:none; border:none; color:var(--faint); font-size:10.5px; white-space:nowrap; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .tab svg { width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .tab.on { color:var(--blue); font-weight:700; }
  main { padding:14px 12px calc(var(--nav-h) + 90px); max-width:720px; margin:0 auto; }

  /* ---- 共通 ---- */
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-bottom:12px; }
  .muted { color:var(--sub); font-size:13px; }
  .warn { background:var(--orange-soft); color:var(--orange); border-radius:10px; padding:8px 12px; margin-bottom:10px; font-size:14px; }
  .bad { background:var(--red-soft); color:var(--red); }
  .ok { color:var(--green); } .tight { color:var(--orange); } .over { color:var(--red); }
  h2.sec { font-size:14px; color:var(--sub); font-weight:700; margin:18px 4px 8px; }
  .sum3 { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .sum { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:10px 8px; text-align:center; }
  .sum .lb { font-size:12px; color:var(--sub); }
  .sum .big { font-size:24px; font-weight:700; margin:2px 0; white-space:nowrap; }
  .sum .big small, .meter-line .big small { font-size:12px; font-weight:700; margin:0 1px; }
  .sum .st { font-size:12px; font-weight:700; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { text-align:right; color:var(--sub); font-weight:400; padding:6px 2px; border-bottom:1px solid var(--line); }
  td { text-align:right; padding:8px 2px; border-bottom:1px solid var(--line); }
  th:first-child, td:first-child { text-align:left; }
  .inline { display:flex; align-items:center; gap:8px; }
  .inline input { width:84px; }
  input, select, textarea { font-size:16px; padding:10px 11px; border:1px solid var(--line); border-radius:10px; width:100%; font-family:inherit; background:var(--card); color:var(--ink); }
  textarea { min-height:170px; line-height:1.6; }
  label { display:block; font-size:12px; color:var(--sub); margin:12px 0 4px; }
  .btn { border:none; border-radius:12px; padding:12px 16px; font-size:15px; font-weight:700; background:var(--blue); color:#fff; }
  .btn.sub { background:var(--soft); color:var(--ink); border:1px solid var(--line); font-weight:400; }
  .btn.danger { background:var(--red-soft); color:var(--red); }
  .btn:disabled { opacity:.4; }
  .btns { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
  .btns .btn { flex:1; }
  .link { background:none; border:none; color:var(--blue); font-size:13px; padding:0; white-space:nowrap; }

  /* ---- タスク行 ---- */
  .row { position:relative; display:flex; align-items:flex-start; gap:10px; padding:10px 0 10px 10px; border-bottom:1px solid var(--line); }
  .row:last-child { border-bottom:none; }
  .row::before { content:""; position:absolute; left:0; top:10px; bottom:10px; width:4px; border-radius:2px; background:var(--pc, var(--p1)); }
  .row.p5 { --pc:var(--p5); } .row.p4 { --pc:var(--p4); } .row.p3 { --pc:var(--p3); } .row.p2 { --pc:var(--p2); } .row.p1 { --pc:var(--p1); }
  .row.child { margin-left:var(--indent); padding-left:12px; }
  .row.child::before { left:2px; width:3px; }
  .row .main { flex:1; min-width:0; }
  .row .nm { word-break:break-all; font-size:15px; }
  .row.lv0 .nm { font-weight:700; font-size:16px; }
  .row .meta { display:flex; flex-wrap:wrap; gap:5px; margin-top:5px; }
  .row.done .nm { text-decoration:line-through; color:var(--faint); }
  .row.done::before { background:var(--line); }
  .chk { width:24px; height:24px; flex:none; margin:1px 0 0; accent-color:var(--blue); }
  .caret:empty { width:0; margin-right:-10px; }
  .caret { width:18px; flex:none; text-align:center; color:var(--faint); background:none; border:none; font-size:11px; padding:5px 0 0; }
  .mini { flex:none; border:1px solid var(--line); background:var(--card); border-radius:999px; padding:5px 10px; font-size:12px; color:var(--blue); }
  .mini.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .row.target { background:var(--blue-soft); border-radius:10px; }
  .row.temp { opacity:.5; }
  .pill { display:inline-flex; align-items:center; font-size:12px; line-height:1; padding:4px 7px; border-radius:6px; background:var(--soft); color:var(--sub); white-space:nowrap; }
  .pill.late { background:var(--red-soft); color:var(--red); font-weight:700; }
  .pill.soon { background:var(--orange-soft); color:var(--orange); font-weight:700; }
  .pill.inherit { background:none; border:1px dashed var(--line); }
  .pill.good { background:var(--green-soft); color:var(--green); }
  .pill.info { background:var(--blue-soft); color:var(--blue); }
  .tag { display:inline-flex; font-size:12px; line-height:1; padding:4px 7px; border-radius:6px; background:var(--blue-soft); color:var(--blue); }
  .tag.red { background:var(--red-soft); color:var(--red); }
  .tag.gray { background:var(--soft); color:var(--sub); }
  .tag.okt { background:var(--green-soft); color:var(--green); }
  .progress { height:4px; background:var(--soft); border-radius:2px; overflow:hidden; margin-top:7px; max-width:220px; }
  .progress i { display:block; height:100%; background:var(--green); }
  .group { padding:4px 14px 4px 12px; }
  .search { display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:2px 12px; margin-bottom:12px; }
  .search svg { width:18px; height:18px; flex:none; stroke:var(--faint); fill:none; stroke-width:2; stroke-linecap:round; }
  .search input { border:none; padding:10px 0; background:transparent; }
  .search input:focus { outline:none; }
  .search input::-webkit-search-cancel-button { display:none; }
  .search:focus-within { border-color:var(--blue); }
  mark { background:var(--orange-soft); color:inherit; border-radius:3px; padding:0 1px; }
  .prio { display:inline-flex; align-items:center; gap:4px; font-size:12px; line-height:1; padding:4px 8px 4px 6px; border-radius:6px; font-weight:700;
          background:var(--pbg); color:var(--pfg); white-space:nowrap; }
  .prio i, .prichip i { width:8px; height:8px; border-radius:50%; background:var(--pfg); flex:none; }
  .q5 { --pfg:var(--p5); --pbg:var(--red-soft); }
  .q4 { --pfg:var(--p4); --pbg:var(--orange-soft); }
  .q3 { --pfg:var(--p3); --pbg:var(--blue-soft); }
  .q2 { --pfg:var(--p2); --pbg:var(--soft); }
  .q1 { --pfg:var(--faint); --pbg:var(--soft); }
  .prio.q1 { font-weight:400; }
  .chip.prichip { display:inline-flex; align-items:center; gap:6px; }
  .chip.prichip.on { background:var(--pfg); border-color:var(--pfg); color:#fff; }
  .chip.prichip.on i { background:#fff; }
  /* ---- 記録 ---- */
  .lc-work { --lc:var(--c-work); } .lc-meet { --lc:var(--c-meet); } .lc-move { --lc:var(--c-move); }
  .lc-break { --lc:var(--c-break); } .lc-learn { --lc:var(--c-learn); } .lc-other { --lc:var(--c-other); }
  .loghead { display:flex; align-items:center; justify-content:space-between; margin:0 0 10px; }
  .loghead div { text-align:center; } .loghead b { font-size:17px; margin-right:6px; }
  .loghead .icon { font-size:26px; color:var(--ink); }
  .logtotal { display:flex; justify-content:space-between; align-items:baseline; }
  .logtotal b { font-size:22px; }
  .catbar { display:flex; height:10px; border-radius:5px; overflow:hidden; margin-top:10px; gap:2px; }
  .catbar i { background:var(--lc); }
  .catlegend { display:flex; flex-wrap:wrap; gap:6px 12px; margin-top:8px; font-size:12px; color:var(--sub); }
  .catlegend i, .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--lc); margin-right:4px; vertical-align:middle; flex:none; }
  .logitem { display:flex; align-items:flex-start; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .logitem:last-of-type { border-bottom:none; }
  .logitem .dot { margin-top:6px; }
  .logitem .main { flex:1; min-width:0; }
  .logitem .meta { margin-top:4px; display:flex; flex-wrap:wrap; gap:5px; }
  .timeline { padding:10px 10px 12px 6px; }
  .nowbtn { width:100%; margin:4px 0 10px 0; }
  .slot { display:flex; align-items:stretch; min-height:34px; height:34px; cursor:pointer; }
  .slot .tl { width:44px; flex:none; font-size:11px; color:var(--sub); text-align:right; padding-right:8px; margin-top:-7px; }
  .slot .empty { flex:1; border-top:1px dashed var(--line); color:transparent; font-size:13px; padding:6px 10px; }
  .slot.hour .empty { border-top:1px solid var(--line); }
  .slot:hover .empty, .slot .empty:active { color:var(--faint); background:var(--soft); }
  .slot.now .empty { background:var(--blue-soft); color:var(--blue); }
  .slot.filled { padding:1px 0; }
  .block { flex:1; border-radius:8px; background:color-mix(in srgb, var(--lc) 16%, var(--card)); border-left:4px solid var(--lc);
           padding:5px 9px; display:flex; flex-direction:column; justify-content:center; overflow:hidden; min-width:0; }
  .block b { font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .block span { font-size:11px; color:var(--sub); }
  .block.one { flex-direction:row; align-items:center; gap:8px; padding:2px 9px; }
  .block.one b { font-size:13px; flex:1; min-width:0; }
  .block.one span { white-space:nowrap; }
  .slot.now .block { outline:2px solid var(--blue); outline-offset:-2px; }
  .chip.catchip { display:inline-flex; align-items:center; gap:6px; }
  .chip.catchip i { width:9px; height:9px; border-radius:50%; background:var(--lc); }
  .chip.catchip.on { background:var(--lc); border-color:var(--lc); color:#fff; }
  .chip.catchip.on i { background:#fff; }
  .chip.taskchip { max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  body.on-log #fab { display:none; }
  .quick { background:var(--blue-soft); border-color:transparent; }
  .qlabel { font-size:13px; font-weight:700; color:var(--blue); margin-bottom:6px; }
  .qrow { display:flex; gap:8px; }
  .qrow .btn { flex:none; }
  .quick .chips { margin-top:8px; }
  .quick .chip { max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tline { padding:8px 10px 10px 4px; }
  .lrow { display:flex; align-items:center; gap:6px; height:40px; border-top:1px dashed var(--line); }
  .lrow.hour { border-top:1px solid var(--line); }
  .lrow .tl { width:42px; flex:none; font-size:12px; color:var(--sub); text-align:right; align-self:flex-start; margin-top:-8px; }
  .lin { flex:1; min-width:0; border:none; background:transparent; padding:8px 8px; font-size:15px; border-radius:8px; }
  .lin:focus { outline:none; background:var(--soft); box-shadow:inset 0 0 0 2px var(--blue); }
  .lrow.has .lin { background:var(--blue-soft); font-weight:700; }
  .lrow.cont .lin { color:var(--sub); font-weight:400; }
  .lrow.now { background:linear-gradient(90deg, transparent 46px, var(--orange-soft) 46px); border-radius:8px; }
  .lrow.now .tl::after { content:"いま"; display:block; font-size:10px; color:var(--orange); font-weight:700; }
  .same { flex:none; border:1px solid var(--line); background:var(--card); color:var(--sub); border-radius:999px; font-size:12px; padding:4px 9px; }
  .lbar { height:5px; background:var(--soft); border-radius:3px; overflow:hidden; margin-top:5px; max-width:240px; }
  .lbar i { display:block; height:100%; background:var(--blue); }
  .pribar { display:flex; height:10px; border-radius:5px; overflow:hidden; gap:2px; margin:10px 0 4px; }
  .pribar i { background:var(--pfg); }
  .prirow { display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line); }
  .prirow:last-child { border-bottom:none; }
  .prirow .prio { width:72px; justify-content:flex-start; }
  .prirow .main { flex:1; min-width:0; }
  .prirow .lbar { max-width:none; margin-top:0; }
  .prirow .lbar i { background:var(--pfg); }
  .prinum { text-align:right; flex:none; min-width:76px; }
  .prinum b { display:block; font-size:15px; }
  .prinum span { font-size:11px; }
  .pathlink { display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; margin-top:7px; padding:7px 10px;
              border:1px dashed var(--line); border-radius:8px; background:transparent; color:var(--sub); font-size:12px; text-align:left; }
  .pathlink span { color:var(--blue); font-weight:700; white-space:nowrap; flex:none; }
  .panel .pathlink { margin:0 0 6px; }
  .backlink { background:none; border:none; color:var(--blue); font-size:14px; font-weight:700; padding:2px 4px 10px; }
  .famsum b { display:block; font-size:18px; margin:2px 0 6px; }
  .famsum .meta { display:flex; flex-wrap:wrap; gap:5px; }
  .row.jump { animation:jump 1.6s ease-out; }
  @keyframes jump { 0%, 40% { background:var(--orange-soft); } 100% { background:transparent; } }
  @media (prefers-reduced-motion: reduce) { .row.jump { animation:none; background:var(--orange-soft); } }
  .recurnote { margin-top:14px; padding:8px 10px; border-radius:8px; background:var(--blue-soft); color:var(--blue); font-size:13px; }
  .everybtn { display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; margin-top:10px; padding:9px 11px;
              border:1px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); }
  .everybtn .box { width:20px; height:20px; flex:none; border:2px solid var(--faint); border-radius:5px; display:flex; align-items:center; justify-content:center; font-size:13px; color:#fff; }
  .everybtn b { display:block; font-size:14px; }
  .everybtn small { display:block; font-size:12px; color:var(--sub); margin-top:2px; }
  .everybtn.on { border-color:var(--blue); background:var(--blue-soft); }
  .everybtn.on .box { background:var(--blue); border-color:var(--blue); }
  .tmpl { border:1px solid var(--line); border-radius:10px; padding:4px 10px; margin-top:6px; }
  .trow { display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .trow:last-child { border-bottom:none; }
  .trow.sub { padding-left:16px; font-size:13px; }
  .trow .tn { flex:1; min-width:0; }
  .overdue { margin-top:10px; border:1px solid var(--red); border-radius:12px; padding:6px 10px 2px; background:var(--red-soft); }
  .warnbox { border-color:var(--orange); background:var(--orange-soft); }
  .warnbox .ovhead { color:var(--orange); }
  .ovhead { font-size:14px; font-weight:700; color:var(--red); padding:4px 0 2px; }
  .overdue .row { border-bottom-color:color-mix(in srgb, var(--red) 25%, transparent); }
  .whorow { display:flex; align-items:center; gap:6px; margin-top:8px; }
  .whorow .chips { margin-top:0; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  .whorow .chip { flex:none; }
  .askhead { display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .askhead b { flex:1; font-size:15px; }
  .askrow::before { background:var(--blue) !important; }
  .askrow.done::before { background:var(--line) !important; }
  .answer { font-size:13px; color:var(--green); margin-top:4px; white-space:pre-wrap; }
  body.on-ask #fab { display:none; }
  .showdone { display:flex; align-items:center; gap:8px; font-size:14px; color:var(--sub); margin:6px 4px; }

  /* ---- やる順 ---- */
  .dayhead { display:flex; justify-content:space-between; align-items:center; }
  .dayhead b { font-size:16px; }
  .bar { height:6px; background:var(--soft); border-radius:3px; overflow:hidden; margin:8px 0 2px; }
  .bar i { display:block; height:100%; background:var(--blue); }

  /* ---- ＋ボタンと入力欄 ---- */

              box-shadow:0 -8px 24px rgba(0,0,0,.12); border-radius:18px 18px 0 0; padding:12px 14px calc(16px + env(safe-area-inset-bottom)); max-height:62vh; overflow:auto; }

  @media (prefers-reduced-motion: reduce) { #busy { animation:none; } #toast { transition:none; } }

<body>
<script>
// ===== ローカル保存版：データはこのブラウザの中だけに保存します =====
(function () {
  var KEY = 'task-bunkai-v1';
  var LEVELS = ['親', '子', '孫'];

  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }

  function load() {
    var db = null;
    try { db = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (!db || !db.tasks) db = { tasks: [], settings: { weekday: 6, weekend: 0, overrides: {} }, nextId: 1 };
    if (!db.settings.overrides) db.settings.overrides = {};
    if (!db.recurring) db.recurring = [];
    if (!db.generated) db.generated = {};
    if (!db.nextRecurId) db.nextRecurId = 1;
    if (!db.logs) db.logs = {};
    if (!db.questions) db.questions = [];
    if (!db.nextQid) db.nextQid = 1;
    return db;
  }
  function save(db) {
    try { localStorage.setItem(KEY, JSON.stringify(db)); }
    catch (e) { throw new Error('このブラウザに保存できませんでした（プライベートモードでは保存できません）'); }
  }
  // ---- 繰り返しタスク ----
  var AHEAD = 7; // 何日先まで作っておくか
  function addDaysStr(s, n) {
    var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2] + n);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function matches(r, s) {
    var p = s.split('-'), d = new Date(+p[0], +p[1] - 1, +p[2]), w = d.getDay();
    if (r.type === 'daily') return true;
    if (r.type === 'weekdays') return w >= 1 && w <= 5;
    if (r.type === 'weekly') return (r.dows || []).indexOf(w) >= 0;
    if (r.type === 'monthly') {
      var last = new Date(+p[0], +p[1], 0).getDate();
      return +p[2] === Math.min(r.mday, last);
    }
    return false;
  }
  // ---- 繰り返しの「毎回つける子タスク」 ----
  // rule.children = [{ tid, name, estimate, priority, children: [{ tid, name, estimate, priority }] }]
  function flatTemplate(rule) {
    var out = [];
    (rule.children || []).forEach(function (c) {
      out.push({ item: c, parentTid: null, depth: 1 });
      (c.children || []).forEach(function (g) { out.push({ item: g, parentTid: c.tid, depth: 2 }); });
    });
    return out;
  }
  /** 新しい項目に番号をつける */
  function assignTids(rule) {
    if (!rule.nextTid) rule.nextTid = 1;
    flatTemplate(rule).forEach(function (f) { if (!f.item.tid) f.item.tid = rule.nextTid++; });
    // 番号が重なっていないかの念のための調整
    flatTemplate(rule).forEach(function (f) { if (f.item.tid >= rule.nextTid) rule.nextTid = f.item.tid + 1; });
  }
  /** 1つの回に、毎回つける子タスクをそろえる（足りないものを足す・消えたものを消す・名前などを合わせる） */
  function syncInstance(db, root, rule, now) {
    var flat = flatTemplate(rule), live = {};
    flat.forEach(function (f) { live[f.item.tid] = f; });
    var under = descendants(db, root.id).slice(1).map(function (id) { return db.tasks.filter(function (t) { return t.id === id; })[0]; });
    // テンプレートから消えたものは消す（終わったものは残す）
    var del = [];
    under.forEach(function (t) {
      if (t && t.tmplId && !live[t.tmplId] && !t.done) del = del.concat(descendants(db, t.id));
    });
    if (del.length) db.tasks = db.tasks.filter(function (t) { return del.indexOf(t.id) < 0; });
    under = under.filter(function (t) { return t && del.indexOf(t.id) < 0; });
    var byTid = {};
    under.forEach(function (t) { if (t.tmplId) byTid[t.tmplId] = t; });
    flat.forEach(function (f) {
      var it = f.item, t = byTid[it.tid];
      if (t) {
        if (!t.done) { t.name = it.name; t.estimate = Number(it.estimate) || 0; t.priority = Number(it.priority) || rule.priority; }
        return;
      }
      var parent = f.parentTid ? byTid[f.parentTid] : root;
      if (!parent) return;
      t = { id: db.nextId++, parentId: parent.id, level: LEVELS[f.depth], name: it.name, estimate: Number(it.estimate) || 0,
            priority: Number(it.priority) || rule.priority, deadline: '', deadlineTime: '', done: false, createdAt: now, doneAt: '', tmplId: it.tid };
      db.tasks.push(t);
      byTid[it.tid] = t;
    });
  }
  /** まだ終わっていない今日以降の回すべてに反映する */
  function syncRule(db, rule) {
    var today = todayStr(), now = new Date().toISOString();
    db.tasks.filter(function (t) { return t.recurId === rule.id && !t.done && t.deadline >= today; })
      .forEach(function (root) { syncInstance(db, root, rule, now); });
  }

  /** 今日から7日先までの回を、まだ作っていなければタスクとして作る */
  function materialize(db) {
    var today = todayStr(), changed = false, now = new Date().toISOString();
    db.recurring.forEach(function (r) {
      for (var i = 0; i < AHEAD; i++) {
        var d = addDaysStr(today, i);
        if (d < r.start || !matches(r, d)) continue;
        var key = r.id + '|' + d;
        if (db.generated[key]) continue;
        db.generated[key] = 1;
        var root = { id: db.nextId++, parentId: null, level: '親', name: r.name, estimate: r.estimate,
          priority: r.priority, deadline: d, deadlineTime: r.time || '', done: false, createdAt: now, doneAt: '', recurId: r.id };
        db.tasks.push(root);
        if ((r.children || []).length) syncInstance(db, root, r, now);
        changed = true;
      }
    });
    // 古い記録は消して軽くしておく
    var old = addDaysStr(today, -60);
    Object.keys(db.generated).forEach(function (k) { if (k.split('|')[1] < old) { delete db.generated[k]; changed = true; } });
    return changed;
  }
  function finish(db) { materialize(db); save(db); return out(db); }

  function out(db) {
    return JSON.parse(JSON.stringify({
      recurring: db.recurring,
      logs: db.logs || {},
      questions: db.questions || [],
      tasks: db.tasks.map(function (t) {
        return { id: t.id, parentId: t.parentId, level: t.level, name: t.name, estimate: t.estimate,
                 priority: t.priority, deadline: t.deadline, deadlineTime: t.deadlineTime || '', done: t.done, recurId: t.recurId || null, tmplId: t.tmplId || null };
      }),
      settings: db.settings, today: todayStr()
    }));
  }
  function descendants(db, id) {
    var ids = [id], added = true;
    while (added) {
      added = false;
      db.tasks.forEach(function (t) {
        if (t.parentId !== null && ids.indexOf(t.parentId) >= 0 && ids.indexOf(t.id) < 0) { ids.push(t.id); added = true; }
      });
    }
    return ids;
  }
  function ancestors(db, id) {
    var ids = [id], cur = db.tasks.filter(function (t) { return t.id === id; })[0];
    while (cur && cur.parentId !== null) {
      ids.push(cur.parentId);
      var pid = cur.parentId;
      cur = db.tasks.filter(function (t) { return t.id === pid; })[0];
    }
    return ids;
  }

  var api = {
    getData: function () { return finish(load()); },
    // ---- 聞きたいこと ----
    addQuestion: function (q) {
      var db = load();
      db.questions.push({ id: db.nextQid++, text: String(q.text || ''), who: String(q.who || ''), answer: '', done: false,
        createdAt: new Date().toISOString(), doneAt: '' });
      return finish(db);
    },
    updateQuestion: function (id, f) {
      var db = load(), q = db.questions.filter(function (x) { return x.id === id; })[0];
      if (!q) throw new Error('見つかりません');
      if (f.text !== undefined) q.text = String(f.text);
      if (f.who !== undefined) q.who = String(f.who);
      if (f.answer !== undefined) q.answer = String(f.answer);
      if (f.done !== undefined && !!f.done !== q.done) { q.done = !!f.done; q.doneAt = q.done ? new Date().toISOString() : ''; }
      return finish(db);
    },
    deleteQuestion: function (id) {
      var db = load();
      db.questions = db.questions.filter(function (x) { return x.id !== id; });
      return finish(db);
    },
    /** 記録：date の start（"09:00"）から count 枠（15分ずつ）を entry で埋める。entry が null なら消す */
    setLog: function (date, start, count, entry) {
      var db = load();
      var day = db.logs[date] || (db.logs[date] = { slots: {}, memo: '' });
      var p = start.split(':'), m = +p[0] * 60 + +p[1];
      for (var i = 0; i < count && m < 1440; i++, m += 15) {
        var k = pad(Math.floor(m / 60)) + ':' + pad(m % 60);
        if (entry) day.slots[k] = { label: String(entry.label || ''), taskId: entry.taskId || null, cat: entry.cat || 'work' };
        else delete day.slots[k];
      }
      if (!Object.keys(day.slots).length && !day.memo) delete db.logs[date];
      return finish(db);
    },
    setLogMemo: function (date, memo) {
      var db = load();
      var day = db.logs[date] || (db.logs[date] = { slots: {}, memo: '' });
      day.memo = String(memo || '');
      if (!Object.keys(day.slots).length && !day.memo) delete db.logs[date];
      return finish(db);
    },
    addRecurring: function (r) {
      var db = load();
      db.recurring.push({ id: db.nextRecurId++, name: String(r.name), estimate: Number(r.estimate) || 0,
        priority: Number(r.priority) || 3, type: r.type, dows: r.dows || [], mday: Number(r.mday) || 1, time: r.time || '', start: todayStr() });
      return finish(db);
    },
    /**
     * 繰り返しをまとめて変更する。まだ終わっていない今日以降の回にも反映する。
     * 曜日や頻度を変えたときは、今日以降の未完了の回（分解していないもの）を作り直す。
     */
    updateRecurring: function (id, r) {
      var db = load(), today = todayStr();
      var rule = db.recurring.filter(function (x) { return x.id === id; })[0];
      if (!rule) throw new Error('繰り返しが見つかりません');
      var newType = r.type || rule.type, newDows = r.dows || rule.dows || [], newMday = Number(r.mday) || rule.mday;
      var patternChanged = newType !== rule.type || newMday !== rule.mday
        || JSON.stringify(newDows.slice().sort()) !== JSON.stringify((rule.dows || []).slice().sort());
      rule.name = String(r.name); rule.estimate = Number(r.estimate) || 0; rule.priority = Number(r.priority) || 3;
      rule.time = r.time || ''; rule.type = newType; rule.dows = newDows; rule.mday = newMday;
      var hasKids = {};
      db.tasks.forEach(function (t) { if (t.parentId !== null && !t.tmplId) hasKids[t.parentId] = true; });
      var del = [];
      db.tasks.forEach(function (t) {
        if (t.recurId !== id || t.done || t.deadline < today) return;
        if (patternChanged && !hasKids[t.id]) {
          del.push(t.id);
          delete db.generated[id + '|' + t.deadline];
        } else {
          t.name = rule.name; t.priority = rule.priority; t.deadlineTime = rule.time;
          if (!hasKids[t.id]) t.estimate = rule.estimate;
        }
      });
      if (del.length) {
        var all = [];
        del.forEach(function (x) { all = all.concat(descendants(db, x)); });
        del = all;
      }
      if (patternChanged) {
        // これから先の日付は、新しい条件で作り直す
        Object.keys(db.generated).forEach(function (k) {
          var p = k.split('|');
          if (+p[0] === id && p[1] >= today) delete db.generated[k];
        });
        var kept = {};
        db.tasks.forEach(function (t) { if (t.recurId === id && del.indexOf(t.id) < 0 && t.deadline >= today) kept[t.deadline] = true; });
        Object.keys(kept).forEach(function (d) { db.generated[id + '|' + d] = 1; });
        db.tasks = db.tasks.filter(function (t) { return del.indexOf(t.id) < 0; });
      }
      if (r.children) { rule.children = r.children; assignTids(rule); }
      syncRule(db, rule);
      return finish(db);
    },
    /** 毎回つける子タスクの一覧を置きかえて、今後の回に反映する */
    setRecurringChildren: function (id, children) {
      var db = load(), rule = db.recurring.filter(function (x) { return x.id === id; })[0];
      if (!rule) throw new Error('繰り返しが見つかりません');
      rule.children = children || [];
      assignTids(rule);
      syncRule(db, rule);
      return finish(db);
    },
    /** 繰り返しをやめる。まだ終わっていない今日以降の回も消す */
    deleteRecurring: function (id) {
      var db = load(), today = todayStr();
      db.recurring = db.recurring.filter(function (r) { return r.id !== id; });
      var del = [];
      db.tasks.forEach(function (t) {
        if (t.recurId === id && !t.done && t.deadline >= today) del = del.concat(descendants(db, t.id));
      });
      db.tasks = db.tasks.filter(function (t) { return del.indexOf(t.id) < 0; });
      return finish(db);
    },
    addTree: function (parentId, nodes) {
      var db = load(), base = 0, newIds = [], now = new Date().toISOString();
      if (parentId !== null) {
        var p = db.tasks.filter(function (t) { return t.id === Number(parentId); })[0];
        if (!p) throw new Error('追加先のタスクが見つかりません');
        base = LEVELS.indexOf(p.level) + 1;
        parentId = p.id;
      }
      (function walk(list, pid, depth) {
        list.forEach(function (n) {
          if (depth > 2) throw new Error('孫より下には分解できません');
          var id = db.nextId++;
          if (pid === parentId) newIds.push(id);
          db.tasks.push({ id: id, parentId: pid, level: LEVELS[depth], name: String(n.name),
            estimate: Number(n.estimate) || 0, priority: Number(n.priority) || 3, deadline: n.deadline || '', deadlineTime: n.deadline ? (n.deadlineTime || '') : '',
            done: false, createdAt: now, doneAt: '' });
          walk(n.children || [], id, depth + 1);
        });
      })(nodes, parentId, base);
      var r = finish(db); r.newIds = newIds; return r;
    },
    updateTask: function (id, f) {
      var db = load(), t = db.tasks.filter(function (x) { return x.id === Number(id); })[0];
      if (!t) throw new Error('タスクが見つかりません');
      t.name = String(f.name); t.estimate = Number(f.estimate) || 0; t.priority = Number(f.priority) || 3; t.deadline = f.deadline || '';
      t.deadlineTime = t.deadline ? (f.deadlineTime || '') : '';
      return finish(db);
    },
    setDone: function (id, done) {
      var db = load(), ids = done ? descendants(db, Number(id)) : ancestors(db, Number(id)), now = new Date().toISOString();
      db.tasks.forEach(function (t) { if (ids.indexOf(t.id) >= 0) { t.done = done; t.doneAt = done ? now : ''; } });
      return finish(db);
    },
    deleteTask: function (id) {
      var db = load(), ids = descendants(db, Number(id));
      db.tasks = db.tasks.filter(function (t) { return ids.indexOf(t.id) < 0; });
      return finish(db);
    },
    saveSettings: function (s) {
      var db = load();
      db.settings.weekday = Number(s.weekday) || 0; db.settings.weekend = Number(s.weekend) || 0;
      return finish(db);
    },
    setDayCap: function (date, hours) {
      var db = load();
      if (hours === null || hours === '' || hours === undefined) delete db.settings.overrides[date];
      else db.settings.overrides[date] = Number(hours) || 0;
      return finish(db);
    },
    exportData: function () { return JSON.stringify(load(), null, 1); },
    importData: function (text) {
      var db = JSON.parse(text);
      if (!db || !Array.isArray(db.tasks) || !db.settings) throw new Error('バックアップファイルの形式が違います');
      if (!db.logs) db.logs = {};
      if (!db.questions) db.questions = [];
      if (!db.nextQid) db.nextQid = db.questions.reduce(function (m, q) { return Math.max(m, q.id); }, 0) + 1;
      if (!db.recurring) db.recurring = [];
      if (!db.generated) db.generated = {};

<script>

function dow(s) { return toDate(s).getUTCDay(); }

function fmtH(h) {

function fmtHM(h) { var t = Math.round(h * 60); return Math.floor(t / 60) + ':' + pad(t % 60); }

/** 「10/25」「明日」「金」「来週月」などを yyyy-mm-dd にする */
function parseDate(s, today) {

  if (s === '明日') return addDays(today, 1);
  if (s === '明後日' || s === 'あさって') return addDays(today, 2);

    if (pm) { priority = +pm[1]; t = t.replace(pm[0], ' '); }

/** タスク一覧から木の情報を作る */

    return tasks.filter(function (t) { return M.isLeaf(t) && !M.closed(t); });

}

function defaultCap(date, settings) {

}
/** その日に使える時間。カレンダーで個別に決めた日はその値を使う */
function capOf(date, settings) {

}

function finishMap(P) {

  P.days.forEach(function (d) {
    d.items.forEach(function (x) { if (!f[x.t.id] || d.date > f[x.t.id]) f[x.t.id] = d.date; });

}

/** 締め切り日ごとの必要時間と、使える時間の比較 */
function loadTable(M, today, todayLeft, settings) {
  var open = M.openLeaves(), byDate = {}, noDl = 0, overdue = 0, overdueN = 0, noEst = 0;
  open.forEach(function (t) {
    if (!t.estimate) noEst++;
    var dl = M.effDeadline(t).date;
    if (!dl) { noDl += t.estimate; return; }
    if (dl < today) { overdue += t.estimate; overdueN++; dl = today; }
    byDate[dl] = (byDate[dl] || 0) + t.estimate;
  });

    var c = todayLeft;
    for (var x = addDays(today, 1); x <= d; x = addDays(x, 1)) c += capOf(x, settings);
    return round2(c);
  }

    var n = 0;
    Object.keys(byDate).forEach(function (k) { if (k <= d) n += byDate[k]; });
    return round2(n);
  }

    var need = needUntil(d), cap = capUntil(d);

  };

/** 締め切りが近い順・優先度が高い順に、1日に使える時間へ自動で割り振る */
function makePlan(M, today, todayLeft, settings) {
  var order = {};

/** 検索用に文字をそろえる：全角/半角、大文字/小文字、カタカナ/ひらがなの違いをなくす */
function normText(s) {

function searchTasks(M, query) {

function logSegments(slots, from, to) {

}

function logSummary(day) {

  Object.keys(slots).forEach(function (k) {

    var key = 'l' + e.label;
    if (!byItem[key]) byItem[key] = { label: e.label, taskId: e.taskId || null, cat: e.cat, h: 0 };
    byItem[key].h += 0.25;

  var items = Object.keys(byItem).map(function (k) { return byItem[k]; }).sort(function (a, b) { return b.h - a.h; });

function quickAdd() {
  if (C.saving) return;
  var inp = $('cName'), name = inp.value.trim();
  if (!name) { inp.focus(); return; }
  var p = targetParent();
  var node = { name: name, estimate: C.estimate || 0, priority: effPriority(), deadline: C.deadline,
               deadlineTime: C.deadline ? C.dlTime : '', children: [] };
  inp.value = '';
  C.estimate = null;

  var rc = recurCtx(p);
  if (rc && C.every) {
    // 繰り返しの「毎回つける子タスク」に登録して、今後の回すべてに足す
    var tmpl = JSON.parse(JSON.stringify(rc.rule.children || []));
    var item = { name: name, estimate: node.estimate, priority: node.priority, children: [] };
    if (rc.parentTid) {
      var holder = tmpl.filter(function (c) { return c.tid === rc.parentTid; })[0];
      if (!holder) { toast('元になる子タスクが見つかりません'); return; }
      (holder.children = holder.children || []).push(item);
    } else tmpl.push(item);
    C.saving = true; renderComposer();
    callRaw('setRecurringChildren', [rc.rule.id, tmpl], function () {
      C.saving = false; toast('今後の回すべてに追加しました');
      setTimeout(function () { $('cName').focus(); }, 60);
    }, function () { C.saving = false; inp.value = name; });
    return;
  }

  if (!p && C.repeat) {
    if (C.repeat === 'weekly' && !C.dows.length) { inp.value = name; toast('曜日を選んでください'); return; }
    var rule = { name: name, estimate: node.estimate, priority: node.priority, type: C.repeat, dows: C.dows.slice(), mday: C.mday, time: C.dlTime };
    C.saving = true;
    renderComposer();
    callRaw('addRecurring', [rule], function () {
      C.saving = false;
      toast('繰り返しタスクを登録しました');
      setTimeout(function () { $('cName').focus(); }, 60);
    }, function () { C.saving = false; inp.value = name; });
    return;
  }

  if (!p) {
    // 親：保存を待ってから、その親の下に子を足すモードに切り替える
    C.saving = true;
    renderComposer();
    callRaw('addTree', [null, [node]], function (res) {
      C.saving = false;
      if (res && res.newIds && res.newIds.length) {
        setTarget(res.newIds[0]);
        toast('親を登録しました。続けて子タスクを追加できます');
      }
      setTimeout(function () { scrollToTarget(); $('cName').focus(); }, 60);
    }, function () { C.saving = false; inp.value = name; });
    return;
  }

  // 子・孫：保存を待たずにすぐ表示して、続けて入力できるようにする
  var temp = { id: -(++tempSeq), parentId: p.id, level: LV[LV.indexOf(p.level) + 1], name: name,
               estimate: node.estimate, priority: node.priority, deadline: node.deadline, deadlineTime: node.deadlineTime, done: false, temp: true };
  pending.push(temp);
  render();
  inp.focus();
  callRaw('addTree', [p.id, [node]], function () {
    pending = pending.filter(function (x) { return x !== temp; });
  }, function () {
    pending = pending.filter(function (x) { return x !== temp; });
    toast('「' + name + '」を保存できませんでした');
  });
}

function nowHM() { var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }

  return (end - d) / 3600000;
}

/** 優先度ごとの残り時間（まだ終わっていない一番下のタスクの見積もりを合計） */
function priorityStats() {
  var w7 = addDays(S.today, 6), st = {};
  [5, 4, 3, 2, 1].forEach(function (p) { st[p] = { all: 0, today: 0, week: 0, n: 0, noEst: 0 }; });
  M.openLeaves().forEach(function (t) {
    if (t.temp) return;
    var x = st[t.priority] || st[3], e = M.effDeadline(t);
    x.all += t.estimate; x.n++;
    if (!t.estimate) x.noEst++;
    if (e.date && e.date <= S.today) x.today += t.estimate;
    if (e.date && e.date <= w7) x.week += t.estimate;
  });
  return st;
}
function priorityCard() {
  var st = priorityStats(), total = 0, max = 0;
  [5, 4, 3, 2, 1].forEach(function (p) { total += st[p].all; max = Math.max(max, st[p].all); });
  var h = '<div class="card"><div class="logtotal"><b style="font-size:15px">優先度別の残り時間</b><span class="muted">合計 ' + fmtH(total) + '</span></div>';
  if (!total && ![5, 4, 3, 2, 1].some(function (p) { return st[p].n; })) return h + '<p class="muted" style="margin:6px 0 0">未完了のタスクはありません</p></div>';
  if (total) {
    h += '<div class="pribar">';
    [5, 4, 3, 2, 1].forEach(function (p) { if (st[p].all) h += '<i class="q' + p + '" style="flex:' + st[p].all + '"></i>'; });
    h += '</div>';
  }
  [5, 4, 3, 2, 1].forEach(function (p) {
    var x = st[p];
    if (!x.n) return;
    var sub = [];
    if (x.today) sub.push('今日まで ' + fmtH(x.today));
    if (x.week) sub.push('7日以内 ' + fmtH(x.week));
    if (x.noEst) sub.push('<span class="over">見積なし ' + x.noEst + '件</span>');
    h += '<div class="prirow">' + priBadge(p)
      + '<div class="main"><div class="lbar q' + p + '"><i style="width:' + (max ? Math.round(x.all / max * 100) : 0) + '%"></i></div>'
      + (sub.length ? '<div class="muted" style="font-size:12px;margin-top:3px">' + sub.join('　') + '</div>' : '') + '</div>'
      + '<div class="prinum"><b>' + fmtH(x.all) + '</b><span class="muted">' + x.n + '件</span></div></div>';
  });
  return h + '</div>';
}

function setTodayLeft(v) { todayLeft = Math.max(0, parseFloat(v) || 0); render(); }

// ---- カレンダー ----
function num(h) { return String(round2(h)); }
/** メーター用：数字を大きく、「時間」「分」を小さく */
function bigTime(h) {
  var t = Math.round(h * 60), hh = Math.floor(t / 60), mm = t % 60;
  if (!t) return '0<small>分</small>';
  return (hh ? hh + '<small>時間</small>' : '') + (mm ? mm + '<small>分</small>' : '');
}
function viewCal() {
  if (!calMonth) calMonth = S.today.slice(0, 7);
  if (!selDay) selDay = S.today;
  var P = makePlan(M, S.today, todayLeft, S.settings);
  var fin = finishMap(P), dayMap = {}, dlMap = {};
  P.days.forEach(function (d) { dayMap[d.date] = d; });
  M.openLeaves().forEach(function (t) {
    var dl = M.effDeadline(t).date;
    if (dl) (dlMap[dl] = dlMap[dl] || []).push(t);
  });
  var ctx = { P: P, fin: fin, dayMap: dayMap, dlMap: dlMap };

  var y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7);
  var first = calMonth + '-01';
  var lastDay = addDays(makeYmd(m === 12 ? y + 1 : y, m === 12 ? 1 : m + 1, 1), -1);
  var h = '<div class="card cal"><div class="calhead"><button class="icon" onclick="moveMonth(-1)">‹</button>'
    + '<b>' + y + '年' + m + '月</b><button class="icon" onclick="moveMonth(1)">›</button></div>'
    + '<div class="grid wk">' + W.map(function (w, i) { return '<div class="' + (i === 0 ? 'sun' : i === 6 ? 'sat' : '') + '">' + w + '</div>'; }).join('') + '</div><div class="grid">';
  for (var d = addDays(first, -dow(first)); d <= lastDay || dow(d) !== 0; d = addDays(d, 1)) {
    var inMonth = d.slice(0, 7) === calMonth, past = d < S.today;
    var cap = d === S.today ? todayLeft : capOf(d, S.settings);
    var used = dayMap[d] ? dayMap[d].used : 0;
    var dls = dlMap[d] || [];
    var late = dls.some(function (t) { var e = M.effDeadline(t); return past || isPast(e.date, e.time) || fin[t.id] > d; });
    var cls = 'cell' + (inMonth ? '' : ' other') + (past ? ' past' : '') + (d === S.today ? ' today' : '') + (d === selDay ? ' sel' : '');
    var c = '<div class="dn' + (dow(d) === 0 ? ' sun' : dow(d) === 6 ? ' sat' : '') + '">' + toDate(d).getUTCDate() + '</div>';
    if (!past) {
      if (cap > 0) {
        var pct = Math.min(100, used / cap * 100);
        c += '<div class="cbar"><i class="' + (pct >= 99.9 ? 'full' : '') + '" style="width:' + pct + '%"></i></div>'
          + '<div class="ch">' + fmtHM(used) + '/' + fmtHM(cap) + '</div>';
      } else {
        c += '<div class="ch rest">休</div>';
      }
    }
    if (dls.length) c += '<div class="cdl' + (late ? ' late' : '') + '">〆' + dls.length + '</div>';
    h += '<button class="' + cls + '" onclick="selectDay(\'' + d + '\')">' + c + '</button>';
  }
  h += '</div><div class="legend"><span><i class="lg"></i>やる予定/使える時間（時:分）</span><span class="late">〆n 間に合わない</span><span>〆n 締め切り</span></div></div>';
  return h + dayDetail(selDay, ctx);
}

/**
 * カレンダーでの並び順
 * 1. 締め切りが今日（または過ぎている）もの
 * 2. 重要度（優先度）が高いもの
 * 3. 同じ重要度の中では締め切りが近いもの（時刻まで見る）
 */
function dueGroup(e) {
  if (!e.date) return 2;
  if (isPast(e.date, e.time)) return 0;      // 期限切れ
  if (e.date === S.today) return 1;          // 今日まで
  return 2;
}
function calOrder(a, b) {
  var ea = M.effDeadline(a), eb = M.effDeadline(b);
  var ta = dueGroup(ea), tb = dueGroup(eb);
  if (ta !== tb) return ta - tb;
  if (a.priority !== b.priority) return b.priority - a.priority;
  var ka = ea.date ? ea.date + ' ' + (ea.time || '99:99') : '9999', kb = eb.date ? eb.date + ' ' + (eb.time || '99:99') : '9999';
  if (ka !== kb) return ka < kb ? -1 : 1;
  return a.id - b.id;
}
function dayDetail(d, ctx) {
  var past = d < S.today;
  var dt = toDate(d);
  var title = (dt.getUTCMonth() + 1) + '月' + dt.getUTCDate() + '日(' + W[dt.getUTCDay()] + ')' + (d === S.today ? '・今日' : '');
  var h = '<div class="card"><b>' + title + '</b>';
  // 今日の欄の一番上に、期限が過ぎたタスクをすべて出す
  var overdue = d === S.today ? M.openLeaves().filter(function (t) { var e = M.effDeadline(t); return !t.temp && isPast(e.date, e.time); }).sort(calOrder) : [];
  var overIds = {};
  if (overdue.length) {
    h += '<div class="overdue"><div class="ovhead">⚠ 期限が過ぎています（' + overdue.length + '件・' + fmtH(overdue.reduce(function (s, t) { return s + t.estimate; }, 0)) + '）</div>';
    overdue.forEach(function (t) { overIds[t.id] = 1; h += taskLine(t, pill(fmtH(t.estimate)) + dlPill(t, false), ''); });
    h += '</div>';
  }
  if (d === S.today) {
    var lateSoon = M.openLeaves().filter(function (t) {
      var e = M.effDeadline(t);
      return !t.temp && !overIds[t.id] && e.date && ctx.fin[t.id] && ctx.fin[t.id] > e.date;
    }).sort(calOrder);
    if (lateSoon.length) {
      h += '<div class="overdue warnbox"><div class="ovhead">⚠ このままだと間に合わない見込み（' + lateSoon.length + '件）</div>'
        + '<div class="muted" style="font-size:12px;margin-bottom:2px">使える時間を増やすか、優先度の低いものの締め切りを見直してください</div>';
      lateSoon.forEach(function (t) {
        var f = ctx.fin[t.id];
        h += taskLine(t, pill(fmtH(t.estimate)) + dlPill(t, false), pill(f === '9999-12-31' ? '入りきらない' : dayLabel(f) + 'に終わる予定', 'late'));
      });
      h += '</div>';
    }
  }
  if (!past) {
    var cap = d === S.today ? todayLeft : capOf(d, S.settings);
    var o = S.settings.overrides || {};
    var isOver = Object.prototype.hasOwnProperty.call(o, d);
    var used = ctx.dayMap[d] ? ctx.dayMap[d].used : 0;
    h += '<div class="clabel">この日に使える時間' + (d === S.today ? '（今日の残り）' : '') + '</div>'
      + '<div class="stepper"><button class="chip step" onclick="stepCap(\'' + d + '\',-1)">−1時間</button>'
      + '<button class="chip step" onclick="stepCap(\'' + d + '\',-0.5)">−30分</button>'
      + '<div class="stepval">' + (cap > 0 ? estLabel(cap) : '休み') + '</div>'
      + '<button class="chip step" onclick="stepCap(\'' + d + '\',0.5)">＋30分</button>'
      + '<button class="chip step" onclick="stepCap(\'' + d + '\',1)">＋1時間</button></div>'
      + '<div class="chips"><button class="chip' + (cap === 0 ? ' on' : '') + '" onclick="setCap(\'' + d + '\',0)">休みにする</button>'
      + (isOver || (d === S.today && todayLeft !== defaultCap(d, S.settings))
          ? '<button class="chip" onclick="resetCap(\'' + d + '\')">標準（' + fmtH(defaultCap(d, S.settings)) + '）に戻す</button>'
          : '<span class="muted" style="align-self:center">標準の時間です（⚙︎で変更）</span>')
      + '</div>';
    var free = round2(cap - used);
    h += '<div class="daysum ' + (cap === 0 ? '' : free <= 0 ? 'full' : 'okbg') + '">やる予定 <b>' + fmtH(used) + '</b> ／ 使える <b>' + fmtH(cap) + '</b>'
      + (cap === 0 ? '' : free > 0 ? '　あと' + fmtH(free) + '空き' : '　いっぱい') + '</div>';
    var items = (ctx.dayMap[d] ? ctx.dayMap[d].items : []).filter(function (x) { return !overIds[x.t.id]; }).sort(function (a, b) { return calOrder(a.t, b.t); });
    if (items.length) {
      h += '<div class="clabel">この日にやる予定</div>';
      items.forEach(function (x) {
        var dl = M.effDeadline(x.t).date;
        h += taskLine(x.t, pill(fmtH(x.h) + (x.part ? '（分割）' : '')) + dlPill(x.t, false), x.late ? pill('遅れ', 'late') : '');
      });
    }
  }
  var dls = (ctx.dlMap[d] || []).slice().sort(calOrder);
  function lateOf(t) { var e = M.effDeadline(t); return past || isPast(e.date, e.time) || ctx.fin[t.id] > d; }
  if (dls.length) {
    var lateN = dls.filter(lateOf).length;
    var total = round2(dls.reduce(function (s, t) { return s + t.estimate; }, 0));
    h += '<div class="clabel">この日が締め切り（' + dls.length + '件・' + fmtH(total) + '）</div>'
      + '<div class="verdict ' + (lateN ? 'ng' : 'good') + '">'
      + (past ? '✗ 期限が過ぎています'
              : lateN ? '✗ ' + lateN + '件が間に合わない見込みです。使える時間を増やすか、締め切り・優先度を見直してください'
                      : '✓ すべて間に合う見込みです') + '</div>';
    dls.forEach(function (t) {
      var f = ctx.fin[t.id], st;
      var et = M.effDeadline(t);
      if (past || isPast(et.date, et.time)) st = pill('期限切れ', 'late');
      else if (!f) st = '';
      else if (f > d) st = pill(f === '9999-12-31' ? '入りきらない' : dayLabel(f) + 'に終わる予定', 'late');
      else st = pill(dayLabel(f) + 'に終わる予定', 'good');
      h += taskLine(t, pill(fmtH(t.estimate)) + dlPill(t, false), st);
    });
  }
  if (past && !dls.length) h += '<p class="muted">過ぎた日です</p>';
  if (!past && !dls.length && !(ctx.dayMap[d] && ctx.dayMap[d].items.length)) h += '<p class="muted">この日の予定・締め切りはありません</p>';
  return h + '</div>';
}

function taskLine(t, meta, tags) {
  var path = M.path(t);
  return '<div class="row p' + t.priority + '"><input type="checkbox" class="chk" onchange="toggleDone(' + t.id + ',this.checked)" aria-label="完了">'
    + '<div class="main" onclick="openEdit(' + t.id + ')"><div class="nm">' + esc(t.name) + '</div>'
    + '<div class="meta">' + priBadge(t.priority) + tags + meta + '</div>'
    + (path ? '<button class="pathlink" onclick="event.stopPropagation();showFamily(' + t.id + ')">' + esc(path) + '<span>全体を見る ›</span></button>' : '')
    + '</div></div>';
}

function selectDay(d) {
  selDay = d;
  if (d.slice(0, 7) !== calMonth) calMonth = d.slice(0, 7);
  render();
}
function moveMonth(n) {
  var y = +calMonth.slice(0, 4), m = +calMonth.slice(5, 7) + n;
  if (m < 1) { m = 12; y--; } if (m > 12) { m = 1; y++; }
  calMonth = y + '-' + pad(m);
  render();
}
function setCap(d, v) {
  v = Math.max(0, round2(v));
  S.settings.overrides = S.settings.overrides || {};
  S.settings.overrides[d] = v;
  if (d === S.today) todayLeft = v;
  render();
  sendCap(d, v);
}
function stepCap(d, delta) {
  var cur = d === S.today ? todayLeft : capOf(d, S.settings);
  setCap(d, cur + delta);
}
function resetCap(d) {
  if (S.settings.overrides) delete S.settings.overrides[d];
  if (d === S.today) todayLeft = defaultCap(d, S.settings);
  render();
  sendCap(d, null);
}
/** 連打しても最後の値だけ保存する */
function sendCap(d, v) {
  clearTimeout(capTimers[d]);
  capTimers[d] = setTimeout(function () { callRaw('setDayCap', [d, v]); }, 700);
}

// ---- 記録（シンプル版：時刻の横に打つだけ） ----
function logDay() { return (S.logs || {})[logDate] || { slots: {}, memo: '' }; }
function recentLabels() {
  var out = [], seen = {};
  Object.keys(S.logs || {}).sort().reverse().slice(0, 14).forEach(function (d) {
    var sl = S.logs[d].slots || {};
    Object.keys(sl).sort().reverse().forEach(function (k) {
      var l = sl[k].label;
      if (l && !seen[l] && out.length < 6) { seen[l] = 1; out.push(l); }
    });
  });
  return out;
}
function viewLog() {
  if (!logDate) logDate = S.today;
  var day = logDay(), sum = logSummary(day), dt = toDate(logDate), isToday = logDate === S.today;
  var nowK = isToday ? minToHm(Math.floor(hmToMin(nowHM()) / 15) * 15) : '';
  var h = '<div class="loghead"><button class="icon" onclick="moveLogDay(-1)" aria-label="前の日">‹</button>'
    + '<div><b>' + (dt.getUTCMonth() + 1) + '月' + dt.getUTCDate() + '日(' + W[dt.getUTCDay()] + ')</b>'
    + (isToday ? '' : '<button class="link" onclick="logDate=S.today;render()">今日へ</button>')
    + '<div class="muted">記録 ' + fmtH(sum.total) + '</div></div>'
    + '<button class="icon" onclick="moveLogDay(1)" aria-label="次の日">›</button></div>';

  if (isToday) {
    var cur = day.slots[nowK];
    h += '<div class="card quick"><div class="qlabel">いま（' + nowK.replace(/^0/, '') + '〜）何してる？</div>'
      + '<div class="qrow"><input id="logNow" type="text" enterkeyhint="done" autocomplete="off" placeholder="' + (cur ? esc(cur.label) : '打ってEnter') + '" onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();logNow(this.value)}">'
      + '<button class="btn" onclick="logNow($(\'logNow\').value)">記録</button></div>';
    var rec = recentLabels();
    if (rec.length) {
      h += '<div class="chips">';
      rec.forEach(function (l, i) { h += '<button class="chip" onclick="logNow(window._rec[' + i + '])">' + esc(l) + '</button>'; });
      h += '</div>';
      window._rec = rec;
    }
    h += '</div>';
  }

  // タイムライン：時刻の横に直接打つ
  var from = logNight ? 0 : 6 * 60;
  h += '<div class="card tline" id="tline" onfocusout="logBlurOut()">';
  h += '<button class="link" style="margin:0 0 6px 4px" onclick="logNight=!logNight;render()">' + (logNight ? '0〜6時を隠す' : '0〜6時も表示') + '</button>';
  var prev = null;
  for (var m = from; m < 1440; m += 15) {
    var k = minToHm(m), e = day.slots[k] || null;
    var cont = e && prev && e.label === prev.label;
    h += '<div class="lrow' + (m % 60 === 0 ? ' hour' : '') + (k === nowK ? ' now' : '') + (e ? ' has' : '') + (cont ? ' cont' : '') + '" data-k="' + k + '">'
      + '<span class="tl">' + (m % 60 === 0 ? k.replace(/^0/, '') : '') + '</span>'
      + '<input class="lin" data-k="' + k + '" value="' + (e ? esc(e.label) : '') + '" enterkeyhint="next" autocomplete="off"'
      + (k === nowK && !e ? ' placeholder="いまここ"' : '')
      + ' onkeydown="logKey(event,this)" onchange="logSave(this)">'
      + (!e && prev ? '<button class="same" onclick="logSame(\'' + k + '\')">↑同じ</button>' : '')
      + '</div>';
    prev = e;
  }
  h += '</div>';

  // 振り返り
  h += '<div class="card"><div class="logtotal"><span>この日の合計</span><b>' + fmtH(sum.total) + '</b></div>';
  if (sum.items.length) {
    var max = sum.items[0].h;
    sum.items.forEach(function (it) {
      h += '<div class="logitem"><div class="main"><div>' + esc(it.label || '（内容なし）') + '</div>'
        + '<div class="lbar"><i style="width:' + Math.round(it.h / max * 100) + '%"></i></div></div><b>' + fmtH(it.h) + '</b></div>';
    });
    h += '<div class="btns"><button class="btn sub" onclick="copyLog()">この日の記録をコピー</button></div>';
  } else {
    h += '<p class="muted" style="margin:6px 0 0">まだ記録はありません</p>';
  }
  h += '<label>振り返りメモ</label><textarea id="logMemo" placeholder="うまくいったこと、次に変えたいことなど" style="min-height:96px" onchange="saveMemo(this.value)">' + esc(day.memo || '') + '</textarea></div>';
  return h;
}

/** 保存（画面を作り直さずに保存する。入力中にキーボードが閉じないように） */
function quietLog(k, label, cb) {
  var day = (S.logs || (S.logs = {}))[logDate] || (S.logs[logDate] = { slots: {}, memo: '' });
  if (label) day.slots[k] = { label: label, taskId: null, cat: 'work' }; else delete day.slots[k];
  google.script.run
    .withSuccessHandler(function (res) { if (res && res.tasks) S = res; if (cb) cb(); })
    .withFailureHandler(function () { toast('保存できませんでした'); })
    .setLog(logDate, k, 1, label ? { label: label, taskId: null, cat: 'work' } : null);
}
function logSave(inp) {
  var k = inp.getAttribute('data-k'), v = inp.value.trim();
  var old = (logDay().slots[k] || {}).label || '';
  if (v === old) return;
  quietLog(k, v);
  var row = inp.parentNode;
  row.classList.toggle('has', !!v);
  var nb = row.querySelector('.same'); if (nb && v) nb.remove();
}
function logKey(e, inp) {
  if (e.key !== 'Enter' || e.isComposing || e.keyCode === 229) return;
  e.preventDefault();
  logSave(inp);
  var next = inp.parentNode.nextElementSibling;
  if (next && next.querySelector('.lin')) next.querySelector('.lin').focus();
  else inp.blur();
}
function logSame(k) {
  var prevK = minToHm(hmToMin(k) - 15), pe = logDay().slots[prevK];
  if (!pe) return;
  quietLog(k, pe.label, function () {});
  render();
}
/** タイムラインから出たら、まとめて表示を更新 */
function logBlurOut() {
  setTimeout(function () {
    var a = document.activeElement;
    if (a && a.classList && a.classList.contains('lin')) return;
    if (tab !== 'log') return;
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }, 80);
}
function logNow(v) {
  v = (v || '').trim();
  if (!v) { $('logNow').focus(); return; }
  var k = minToHm(Math.floor(hmToMin(nowHM()) / 15) * 15);
  quietLog(k, v, function () { var y = window.scrollY; render(); window.scrollTo(0, y); });
  toast(k.replace(/^0/, '') + '〜 に記録しました');
}
function moveLogDay(n) { logDate = addDays(logDate || S.today, n); render(); window.scrollTo(0, 0); }
function saveMemo(v) {
  google.script.run.withSuccessHandler(function (res) { if (res && res.tasks) S = res; toast('メモを保存しました'); }).setLogMemo(logDate, v);
}
function copyLog() {
  var day = logDay(), dt = toDate(logDate);
  var lines = [(dt.getUTCMonth() + 1) + '/' + dt.getUTCDate() + '(' + W[dt.getUTCDay()] + ') の記録'];
  logSegments(day.slots, 0, 1440).forEach(function (sg) {
    if (!sg.entry) return;
    lines.push(minToHm(sg.start).replace(/^0/, '') + '〜' + minToHm(sg.start + sg.count * 15).replace(/^0/, '') + ' ' + sg.entry.label + '（' + fmtH(sg.count * 0.25) + '）');
  });
  lines.push('合計 ' + fmtH(logSummary(day).total));
  if (day.memo) lines.push('', '振り返り：', day.memo);
  copyText(lines.join('\n'));
}

// ---- 聞きたいこと（ToDoとは別のメモ） ----
function askWhoList() {
  var seen = {}, out = [];
  (S.questions || []).slice().reverse().forEach(function (q) { if (q.who && !seen[q.who]) { seen[q.who] = 1; out.push(q.who); } });
  return out.slice(0, 8);
}
function viewAsk() {
  var qs = S.questions || [], open = qs.filter(function (q) { return !q.done; }), done = qs.filter(function (q) { return q.done; });
  var who = askWhoList();
  var h = '<div class="card quick"><div class="qlabel">聞きたいことをメモ</div>'
    + '<div class="qrow"><input id="askText" type="text" enterkeyhint="done" autocomplete="off" placeholder="聞きたいことを入れてEnter" onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();addAsk()}">'
    + '<button class="btn" onclick="addAsk()">追加</button></div>'
    + '<div class="whorow"><span class="muted">誰に：</span><div class="chips">'
    + '<button class="chip' + (!AQ.who ? ' on' : '') + '" onclick="setAskWho(\'\')">指定なし</button>';

}

function viewTree() {

/** 検索欄そのものは作り直さず、結果の一覧だけ入れ替える（日本語入力の変換中に壊れないように） */

}

/** 一致した部分に印をつける */
function markName(name) {
  if (!SR) return esc(name);
  var norm = normText(name), out = esc(name);
  if (norm.length !== name.length) return out; // 文字数が変わる名前は印をつけない
  SR.words.forEach(function (w) {
    var i = norm.indexOf(w);
    if (i >= 0) {
      var part = name.substr(i, w.length);
      out = out.replace(esc(part), '<mark>' + esc(part) + '</mark>');
    }

}
function treeList() {
  SR = searchTasks(M, query);
  var roots = M.roots.filter(function (t) { return SR ? SR.show[t.id] : (showDone || !M.closed(t)); }).sort(function (a, b) {
    var da = M.effDeadline(a).date || '9999', db = M.effDeadline(b).date || '9999';
    if (da !== db) return da < db ? -1 : 1;
    return b.priority - a.priority;
  });
  // 繰り返しタスクは、まだ終わっていない一番近い回だけ表示する
  var seenRecur = {}, laterCount = {};
  roots = roots.filter(function (t) {
    if (SR || !t.recurId || M.closed(t)) return true;
    if (seenRecur[t.recurId]) { laterCount[t.recurId] = (laterCount[t.recurId] || 0) + 1; return false; }
    seenRecur[t.recurId] = true;
    return true;
  });
  window._laterCount = laterCount;
  var h = '';
  if (SR) h += '<p class="muted" style="margin:0 4px 10px">' + (SR.count ? SR.count + '件見つかりました（完了したものも含みます）' : '「' + esc(query) + '」を含むタスクはありません') + '</p>';
  else if (!roots.length) h += '<div class="card"><p class="muted">タスクはまだありません。右下の＋から追加できます。</p></div>';
  roots.forEach(function (t) { h += '<div class="card group">' + treeRow(t, 0) + '</div>'; });
  if (!SR) h += '<label class="showdone"><input type="checkbox" class="chk" ' + (showDone ? 'checked' : '') + ' onchange="showDone=this.checked;render()">完了したものも表示</label>';

function treeRow(t, depth) {

      .forEach(function (c) { h += treeRow(c, depth + 1); });

}

function copyText(text) {

// ---- 追加（まとめ入力） ----
function openBulk(parentId) {
  var p = parentId === null ? null : M.byId[parentId];

  addCtx = { parentId: parentId, maxDepth: 3 - base, defaultPriority: p ? p.priority : 3 };
  var title = p ? '「' + esc(p.name) + '」を分解' : '新しいタスク';
  var ph = p ? '構成を考える 1h\nデータ集め\n- 売上データ 1h\n- 競合データ 1.5h\nスライド作成 3h'
             : '提案書を作る 〆10/25 優4\n- 構成を考える 1h\n- データ集め\n-- 売上データ 1h\n-- 競合データ 1.5h\n- スライド作成 3h';
  openPanel('<h3>' + title + '</h3>'
    + '<textarea id="addText" placeholder="' + esc(ph) + '" oninput="updatePreview()"></textarea>'
    + '<details><summary>書き方</summary><pre>1行に1タスク\n行頭の「-」の数で1段下（「・」や字下げでもOK）\n時間：1h　1.5時間　30分　1h30m\n締切：〆10/25　@明日　@金　@来週月\n優先度：優4　!4（1〜5、大きいほど高い）\n書かなければ：優先度は上と同じ、締切は上の締切を使います\n分解したタスクの時間は、下の合計になります</pre></details>'
    + '<div id="preview" class="preview muted">入力すると、ここに確認が出ます</div>'
    + '<div class="btns"><button class="btn sub" onclick="closeModal()">やめる</button><button class="btn" id="saveAdd" onclick="saveAdd()" disabled>登録する</button></div>');
  setTimeout(function () { $('addText').focus(); }, 50);
}

function updatePreview() {
  var r = parseInput($('addText').value, { today: S.today, maxDepth: addCtx.maxDepth, defaultPriority: addCtx.defaultPriority });
  addCtx.parsed = r;
  var h = '';
  function sum(n) { return n.children.length ? n.children.reduce(function (s, c) { return s + sum(c); }, 0) : n.estimate; }
  function draw(n, depth) {
    var bits = [n.children.length ? '計' + fmtH(round2(sum(n))) : (n.hasEst ? fmtH(n.estimate) : '<span class="tag red">見積なし</span>')];
    if (n.deadline) bits.push('〆' + dlText(n.deadline, n.deadlineTime));
    bits.push('優' + n.priority);
    h += '<div class="pv" style="padding-left:' + depth * 16 + 'px">' + (depth ? '└ ' : '') + esc(n.name)
      + ' <span class="muted">' + bits.join(' ・ ') + '</span></div>';
    n.children.forEach(function (c) { draw(c, depth + 1); });
  }
  r.nodes.forEach(function (n) { draw(n, 0); });
  r.errors.forEach(function (e) { h += '<div class="err">' + esc(e) + '</div>'; });
  $('preview').innerHTML = h || '入力すると、ここに確認が出ます';
  $('saveAdd').disabled = !r.nodes.length || r.errors.length > 0;
}

function saveAdd() {
  var r = addCtx.parsed;
  if (!r || !r.nodes.length || r.errors.length) return;
  var parentId = addCtx.parentId;
  $('saveAdd').disabled = true;
  call('addTree', [parentId, r.nodes], function () {
    if (parentId !== null) collapsed[parentId] = false;
    closeModal();
    if (C.open) $('cName').focus();
    toast('登録しました');
  });
}

    + (t.recurId && ruleOf(t.recurId)
        ? '<div class="recurnote">🔁 繰り返しの予定です（' + recurWhen(ruleOf(t.recurId)) + '）</div>'

// ---- 繰り返しをまとめて編集 ----
/** 追加先が繰り返しの回（またはその「毎回つける子タスク」）なら、元の繰り返しを返す */
function recurCtx(p) {
  if (!p || p.temp) return null;
  if (p.recurId && p.parentId === null) { var r = ruleOf(p.recurId); return r ? { rule: r, parentTid: null } : null; }
  var par = M.byId[p.parentId];
  if (p.tmplId && par && par.recurId && par.parentId === null && LV.indexOf(p.level) === 1) {
    var r2 = ruleOf(par.recurId); return r2 ? { rule: r2, parentTid: p.tmplId } : null;
  }
  return null;
}
var RECUR_NAMES = { daily: '毎日', weekdays: '平日', weekly: '毎週', monthly: '毎月' };
function ruleOf(id) { return (S.recurring || []).filter(function (r) { return r.id === id; })[0]; }
function recurWhen(r) {
  return RECUR_NAMES[r.type]
    + (r.type === 'weekly' ? '（' + (r.dows || []).slice().sort(function (a, b) { return ((a + 6) % 7) - ((b + 6) % 7); }).map(function (d) { return W[d]; }).join('・') + '）' : '')
    + (r.type === 'monthly' ? ' ' + r.mday + '日' : '')
    + (r.time ? ' ' + r.time + 'まで' : '');
}
/** 編集画面の内容で、今後の回をまとめて変える（日付以外） */
function saveEditAll(id) {
  var t = M.byId[id], r = ruleOf(t.recurId), name = $('eName').value.trim();
  if (!name) { toast('タスク名を入れてください'); return; }
  var est = M.isLeaf(t) ? (parseFloat($('eEst').value) || 0) / 60 : r.estimate;
  call('updateRecurring', [r.id, { name: name, estimate: est, priority: +$('ePri').value, time: $('eTm').value,
    type: r.type, dows: r.dows, mday: r.mday }], function () { closeModal(); toast('今後の回もまとめて変更しました'); });
}
var RE = null;
/** 繰り返しの設定画面（名前・時間・優先度・曜日・時刻） */
function openRecurEdit(id) {
  var r = ruleOf(id); if (!r) return;
  RE = { id: id, name: r.name, est: Math.round(r.estimate * 60), pri: r.priority, type: r.type, dows: (r.dows || []).slice(), mday: r.mday, time: r.time || '',
        kids: JSON.parse(JSON.stringify(r.children || [])), under: null };
  renderRecurEdit();
}
function renderRecurEdit() {
  var h = '<h3>🔁 繰り返しをまとめて編集</h3><p class="muted" style="margin:0 0 4px">まだ終わっていない今日以降の回に反映されます。終わった回はそのままです。</p>'
    + '<label>タスク名</label><input id="rName" value="' + esc(RE.name) + '" oninput="RE.name=this.value">'
    + '<label>見積もり（分）</label><input id="rEst" type="number" min="0" step="5" inputmode="numeric" value="' + RE.est + '" oninput="RE.est=+this.value||0">'
    + '<div class="clabel">優先度</div><div class="chips">';
  [5, 4, 3, 2, 1].forEach(function (n) {
    h += '<button class="chip prichip q' + n + (RE.pri === n ? ' on' : '') + '" onclick="RE.pri=' + n + ';renderRecurEdit()"><i></i>' + PRI_LABEL[n] + '</button>';
  });
  h += '</div><div class="clabel">繰り返し</div><div class="chips">';
  ['daily', 'weekdays', 'weekly', 'monthly'].forEach(function (k) {
    h += '<button class="chip' + (RE.type === k ? ' on' : '') + '" onclick="RE.type=\'' + k + '\';if(RE.type===\'weekly\'&&!RE.dows.length)RE.dows=[dow(S.today)];renderRecurEdit()">' + RECUR_NAMES[k] + '</button>';
  });
  h += '</div>';
  if (RE.type === 'weekly') {
    h += '<div class="chips">';
    [1, 2, 3, 4, 5, 6, 0].forEach(function (d) {
      h += '<button class="chip pri' + (RE.dows.indexOf(d) >= 0 ? ' on' : '') + '" onclick="reToggleDow(' + d + ')">' + W[d] + '</button>';
    });
    h += '</div>';
  }
  if (RE.type === 'monthly') {
    h += '<div class="stepper"><button class="chip step" onclick="RE.mday=Math.max(1,RE.mday-1);renderRecurEdit()">−1日</button>'
      + '<div class="stepval">毎月 ' + RE.mday + '日</div><button class="chip step" onclick="RE.mday=Math.min(31,RE.mday+1);renderRecurEdit()">＋1日</button></div>';
  }
  h += '<label>締め切りの時刻</label><input id="rTime" type="time" class="dateinput" value="' + esc(RE.time) + '" onchange="RE.time=this.value">';
  // 毎回つける子タスク
  h += '<div class="clabel" style="margin-top:16px">毎回つける子タスク</div><div class="tmpl">';
  if (!RE.kids.length) h += '<p class="muted" style="margin:4px 0">まだありません。下から追加できます。</p>';
  RE.kids.forEach(function (c, i) {
    h += '<div class="trow"><span class="tn">' + esc(c.name) + '</span><span class="muted">' + (c.estimate ? fmtH(c.estimate) : '') + '</span>'
      + '<button class="mini' + (RE.under === i ? ' on' : '') + '" onclick="RE.under=(RE.under===' + i + '?null:' + i + ');renderRecurEdit()">＋孫</button>'
      + '<button class="mini" style="color:var(--red)" onclick="RE.kids.splice(' + i + ',1);RE.under=null;renderRecurEdit()">×</button></div>';
    (c.children || []).forEach(function (g, j) {
      h += '<div class="trow sub"><span class="tn">└ ' + esc(g.name) + '</span><span class="muted">' + (g.estimate ? fmtH(g.estimate) : '') + '</span>'
        + '<button class="mini" style="color:var(--red)" onclick="RE.kids[' + i + '].children.splice(' + j + ',1);renderRecurEdit()">×</button></div>';
    });
  });
  var underName = RE.under !== null && RE.kids[RE.under] ? RE.kids[RE.under].name : null;
  h += '</div><div class="muted" style="margin-top:6px;font-size:12px">' + (underName ? '「' + esc(underName) + '」の下に孫を追加' : '子タスクを追加') + '</div>'
    + '<div class="cinput" style="margin-top:4px"><input id="rKid" placeholder="名前" autocomplete="off" onkeydown="if(event.key===\'Enter\'&&!event.isComposing&&event.keyCode!==229){event.preventDefault();reAddKid()}">'
    + '<input id="rKidMin" type="number" min="0" step="5" inputmode="numeric" placeholder="分" style="width:70px;flex:none">'
    + '<button class="btn sub" onclick="reAddKid()">追加</button></div>'
    + '<div class="btns"><button class="btn sub" onclick="closeModal()">やめる</button><button class="btn" onclick="saveRecurEdit()">まとめて保存</button></div>'
    + '<div class="btns"><button class="btn danger" onclick="stopRecur(' + RE.id + ')">この繰り返しをやめる</button></div>';
  var y = $('panel').scrollTop;
  openPanel(h);
  $('panel').scrollTop = y;
}
function reAddKid() {
  var n = $('rKid').value.trim(); if (!n) return;
  var it = { name: n, estimate: (+$('rKidMin').value || 0) / 60, priority: RE.pri, children: [] };
  RE.name = $('rName').value.trim() || RE.name; RE.est = +$('rEst').value || 0; RE.time = $('rTime').value;
  if (RE.under !== null && RE.kids[RE.under]) (RE.kids[RE.under].children = RE.kids[RE.under].children || []).push(it);
  else RE.kids.push(it);
  renderRecurEdit();
  setTimeout(function () { var k = $('rKid'); if (k && !('ontouchstart' in window)) k.focus(); }, 30);
}
function reToggleDow(d) { var i = RE.dows.indexOf(d); if (i >= 0) RE.dows.splice(i, 1); else RE.dows.push(d); renderRecurEdit(); }
function saveRecurEdit() {
  RE.name = $('rName').value.trim(); RE.est = +$('rEst').value || 0; RE.time = $('rTime').value;
  if (!RE.name) { toast('タスク名を入れてください'); return; }
  if (RE.type === 'weekly' && !RE.dows.length) { toast('曜日を選んでください'); return; }
  call('updateRecurring', [RE.id, { name: RE.name, estimate: RE.est / 60, priority: RE.pri, time: RE.time, type: RE.type, dows: RE.dows, mday: RE.mday, children: RE.kids }],
    function () { closeModal(); toast('今後の回もまとめて変更しました'); });
}
function stopRecur(id) {
  if (!confirm('この繰り返しをやめますか？まだ終わっていない今日以降の回も消えます。')) return;
  call('deleteRecurring', [id], function () { closeModal(); toast('繰り返しをやめました'); });
}
function saveEdit(id) {
  var name = $('eName').value.trim();
  if (!name) { toast('タスク名を入れてください'); return; }
  call('updateTask', [id, { name: name, estimate: (parseFloat($('eEst').value) || 0) / 60, priority: +$('ePri').value, deadline: $('eDl').value, deadlineTime: $('eDl').value ? $('eTm').value : '' }],
    function () { closeModal(); toast('保存しました'); });
}
function removeTask(id) {
  var n = M.byId[id] ? M.leaves(M.byId[id]).length : 0;
  var msg = M.isLeaf(M.byId[id]) ? 'このタスクを削除しますか？' : 'このタスクと、下にある全部のタスクを削除しますか？';
  if (!confirm(msg)) return;
  call('deleteTask', [id], function () { closeModal(); toast('削除しました'); });
}

// ---- 設定 ----
function getTheme() { try { return localStorage.getItem('task-theme') || 'auto'; } catch (e) { return 'auto'; } }
function setTheme(t) {
  try { if (t === 'auto') localStorage.removeItem('task-theme'); else localStorage.setItem('task-theme', t); } catch (e) {}
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  openSettings();
}
function openSettings() {
  var th = getTheme();
  openPanel('<h3>画面の色</h3><div class="chips">'
    + [['auto', '自動（端末に合わせる）'], ['light', '明るい'], ['dark', '暗い']].map(function (x) {
        return '<button class="chip' + (th === x[0] ? ' on' : '') + '" onclick="setTheme(\'' + x[0] + '\')">' + x[1] + '</button>';
      }).join('') + '</div>'
    + '<h3 style="margin-top:22px">作業に使える時間</h3><p class="muted">負荷の計算と「やる順」の割り振りに使います。会議などを除いた、実際にタスクに使える時間を入れてください。</p>'
    + '<label>平日（時間）</label><input id="sWd" type="number" min="0" step="0.5" value="' + S.settings.weekday + '">'
    + '<label>土日（時間）</label><input id="sWe" type="number" min="0" step="0.5" value="' + S.settings.weekend + '">'
    + '<div class="btns"><button class="btn sub" onclick="closeModal()">やめる</button><button class="btn" onclick="saveSettings()">保存</button></div>');
}
function saveSettings() {
  var s = { weekday: parseFloat($('sWd').value) || 0, weekend: parseFloat($('sWe').value) || 0 };
  call('saveSettings', [s], function () { todayLeft = capOf(S.today, S.settings); closeModal(); toast('保存しました'); });
}

function openPanel(html) { $('panel').innerHTML = html; $('panel').scrollTop = 0; $('modal').classList.remove('hidden'); }
function closeModal() { $('modal').classList.add('hidden'); }

setInterval(function () {
  var a = document.activeElement;
  if (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return;
  if (!$('modal').classList.contains('hidden')) return;
  render();
}, 60000);
if (window.google && google.script) {
  call('getData', []);
} else {
  $('view').innerHTML = '<div class="warn bad">この画面はGoogleにつながっていません。Apps Scriptで「デプロイ」したURLから開いてください。</div>';
}
</script>
<script>
// ===== ローカル版だけの機能：バックアップ =====
(function () {
  var baseOpen = openSettings;
  openSettings = function () {
    baseOpen();
    var rec = S.recurring || [];
    var names = { daily: '毎日', weekdays: '平日', weekly: '毎週', monthly: '毎月' };
    var rh = '<h3 style="margin-top:22px">繰り返しタスク</h3>';
    if (!rec.length) rh += '<p class="muted">登録はありません。＋で親タスクを追加するときに「繰り返し」を選ぶと登録できます。</p>';
    rec.forEach(function (r) {
      var when = names[r.type] + (r.type === 'weekly' ? '（' + r.dows.slice().sort(function (a, b) { return ((a + 6) % 7) - ((b + 6) % 7); }).map(function (d) { return W[d]; }).join('・') + '）' : '')
        + (r.type === 'monthly' ? ' ' + r.mday + '日' : '')
        + (r.time ? ' ' + r.time + 'まで' : '');
      rh += '<div class="row"><div class="main"><div class="nm">🔁 ' + esc(r.name) + '</div><div class="meta">' + when
        + (r.estimate ? ' ・ ' + fmtH(r.estimate) : '') + ' ・ 優先度 ' + PRI_LABEL[r.priority] + '</div></div>'
        + '<button class="mini" onclick="openRecurEdit(' + r.id + ')">編集</button></div>';
    });
    $('panel').insertAdjacentHTML('beforeend', rh);
    $('panel').insertAdjacentHTML('beforeend',
      '<h3 style="margin-top:22px">バックアップ</h3>'
      + '<p class="muted">データはこのブラウザの中だけに保存されています。ブラウザの履歴やデータを消すと一緒に消えるので、ときどき保存しておいてください。</p>'
      + '<div class="btns"><button class="btn sub" onclick="exportBackup()">バックアップを保存</button>'
      + '<label class="btn sub" style="text-align:center">バックアップから戻す<input type="file" accept=".json,application/json" style="display:none" onchange="importBackup(this)"></label></div>');
  };
  window.stopRecurring = function (id) {
    if (!confirm('この繰り返しをやめますか？まだ終わっていない今日以降の回も消えます。')) return;
    call('deleteRecurring', [id], function () { openSettings(); toast('繰り返しをやめました'); });
  };
  window.exportBackup = function () {
    var text = LOCAL_API.exportData();
    var blob = new Blob([text], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'タスク分解_バックアップ_' + S.today + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 2000);
    toast('バックアップを保存しました');
  };
  window.importBackup = function (input) {
    var f = input.files && input.files[0];
    if (!f) return;
    if (!confirm('今のデータを、このバックアップの内容で置き換えます。よいですか？')) { input.value = ''; return; }
    var r = new FileReader();
    r.onload = function () {
      call('importData', [String(r.result)], function () { closeModal(); toast('バックアップから戻しました'); });
    };
    r.readAsText(f);
  };
})();

</script>
</body>
</html>
